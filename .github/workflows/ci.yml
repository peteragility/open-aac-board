name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the lockfile uses the public npm registry
        run: node scripts/check-lockfile.cjs

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Run local unit tests
        run: npm run test:local

      - name: Build
        run: npm run build

      - name: Run browser tests and accessibility checks
        env:
          # Preinstalled Google Chrome on GitHub-hosted Ubuntu runners.
          AAC_CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:web

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build
          retention-days: 7

  licenses:
    # The inventory covers every locked package, including macOS-only optional
    # ones such as fsevents, and is generated and deployed from macOS.
    name: License inventory
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check license inventory
        run: npm run licenses:check
